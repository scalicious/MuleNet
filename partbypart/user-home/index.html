<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Home | SOS Safety System</title>
  <!-- Google Font: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Supabase JS Client SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #141414;
      --card-bg: #191b22;
      --card-border: #282c38;
      --gold-primary: #e5a93b;
      --gold-gradient: linear-gradient(135deg, #f5c443 0%, #d4951d 100%);
      --text-white: #ffffff;
      --text-muted: #8891a4;
      --font-family: 'Inter', sans-serif;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      font-family: var(--font-family);
      color: var(--text-white);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .home-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 40px 36px;
      max-width: 440px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--gold-primary);
      background-color: rgba(229, 169, 59, 0.1);
      border: 1px solid rgba(229, 169, 59, 0.25);
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }
    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin: 0 0 10px 0;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 24px;
    }
    .user-email {
      color: var(--gold-primary);
      font-weight: 600;
    }
    .btn-logout {
      width: 100%;
      height: 48px;
      background: var(--gold-gradient);
      color: #08090a;
      border: none;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .btn-logout:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <div class="home-card">
    <div class="badge">USER PORTAL</div>
    <h1>User Home</h1>
    <p>Logged in as: <span id="userEmail" class="user-email">Loading...</span></p>
    <button id="logoutBtn" class="btn-logout">Sign Out</button>
    <div id="homeError" class="home-error" style="display: none; color: #ff6b6b; background-color: rgba(234, 67, 53, 0.12); border: 1px solid rgba(234, 67, 53, 0.35); padding: 10px 14px; border-radius: 12px; margin-top: 14px; font-size: 0.85rem;"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://jkcgutjknjykqasenwqq.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_PtBOjVSdVe4eKPfBDE8y6g_RUGPzvG6';

    const supabaseClient = window.supabase
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
      : null;

    const LOGIN_PAGE_URL = '../user-login/index.html';

    async function checkSession() {
      if (!supabaseClient) {
        window.location.href = LOGIN_PAGE_URL;
        return;
      }
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        // Not authenticated, redirect to User Login
        window.location.href = LOGIN_PAGE_URL;
      } else {
        document.getElementById('userEmail').textContent = session.user.email || 'Authenticated User';
      }
    }

    if (supabaseClient) {
      supabaseClient.auth.onAuthStateChange((event, session) => {
        if (!session || event === 'SIGNED_OUT') {
          window.location.href = LOGIN_PAGE_URL;
        }
      });
    }

    const logoutBtn = document.getElementById('logoutBtn');
    const homeError = document.getElementById('homeError');

    logoutBtn.addEventListener('click', async () => {
      if (homeError) homeError.style.display = 'none';
      if (logoutBtn) {
        logoutBtn.disabled = true;
        logoutBtn.textContent = 'Signing Out...';
      }

      if (supabaseClient) {
        try {
          const { error } = await supabaseClient.auth.signOut();
          if (error) {
            if (homeError) {
              homeError.textContent = error.message || 'Failed to sign out. Please try again.';
              homeError.style.display = 'block';
            }
            if (logoutBtn) {
              logoutBtn.disabled = false;
              logoutBtn.textContent = 'Sign Out';
            }
            return;
          }
        } catch (err) {
          if (homeError) {
            homeError.textContent = 'Failed to sign out. Please try again.';
            homeError.style.display = 'block';
          }
          if (logoutBtn) {
            logoutBtn.disabled = false;
            logoutBtn.textContent = 'Sign Out';
          }
          return;
        }
      }
      window.location.href = LOGIN_PAGE_URL;
    });

    checkSession();
  </script>
</body>
</html>
